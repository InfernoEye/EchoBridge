version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "scipy"
        versions:
          - ">=1.18.0"
      # NumPy 2.5+ requires Python 3.12; EchoBridge currently targets 3.11.
      - dependency-name: "numpy"
        versions:
          - ">=2.5.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"