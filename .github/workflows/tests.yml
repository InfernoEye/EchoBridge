name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - name: Check out EchoBridge
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python files
        shell: pwsh
        run: python -m compileall -q app.py echobridge_runtime.py echobridge_capture.py echobridge_worker.py
      - name: Run tests
        shell: pwsh
        run: python -m pytest -q
